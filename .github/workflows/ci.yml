name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck · build · test · PDF security · docs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install browser regression runtime
        run: npx playwright install --with-deps chromium-headless-shell

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Unit and smoke tests
        run: npm test

      - name: Adversarial PDF browser regression
        run: npm run test:pdf-security

      - name: Floating promise gate
        run: npm run check:promises

      - name: Source, docs, and metadata consistency
        run: npm run check:docs

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=low

      - name: Development skills integrity
        run: npm run check:skills

      - name: Chat preview (real-DOM)
        shell: bash
        run: node test/build-preview.mjs

      - name: Settings preview (real-DOM, probes as read-only)
        shell: bash
        env:
          OA_RELEASE_WITNESS: readonly
        run: node test/real-preview/build-settings.mjs

      - name: Assert clean tracked tree after preview steps
        shell: bash
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "✗ tracked tree is dirty after preview steps"
            git status --porcelain
            exit 1
          fi
          echo "✓ tracked tree still clean after preview steps"        

# TEMPLATE ONLY — Arena cannot create or modify .github/workflows files.
# Owner action: copy this file verbatim to .github/workflows/release.yml through
# the GitHub web UI after the release-tooling PR is merged.
name: Publish GitHub Release

on:
  workflow_dispatch:
    inputs:
      reconstructed:
        description: "Disclose that historical artifact bytes were rebuilt"
        required: true
        default: false
        type: boolean

permissions:
  actions: read
  checks: read
  contents: write

concurrency:
  group: publish-release
  cancel-in-progress: false

jobs:
  publish:
    name: Build, publish, and verify release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout the default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install browser regression runtime
        run: npx playwright install --with-deps chromium-headless-shell

      - name: Build complete verified asset set
        shell: bash
        run: |
          args=()
          if [[ "${{ inputs.reconstructed }}" == "true" ]]; then
            args+=(--reconstructed)
          fi
          npm run release -- "${args[@]}"

      - name: Publisher dry run
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run publish:release

      - name: Publish and independently verify GitHub assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(node -p "require('./manifest.json').version")"
          npm run publish:release -- --publish --confirm "$tag"
